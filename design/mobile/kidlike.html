
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font-sans)}
.phone{width:320px;margin:0 auto;background:#FFF8F0;border:0.5px solid var(--border);border-radius:40px;overflow:hidden;padding:0 0 0}
.statusbar{height:40px;display:flex;align-items:flex-end;justify-content:space-between;padding:0 22px 7px;background:#FFF8F0}
.stime{font-size:13px;font-weight:500;color:#3C2A10}
.sicons{display:flex;align-items:center;gap:4px;color:#3C2A10}
.sicons i{font-size:14px}
.header{padding:6px 18px 14px;background:#FFF8F0}
.h-row{display:flex;align-items:center;justify-content:space-between}
.h-left{display:flex;align-items:center;gap:10px}
.kid-avatar{width:38px;height:38px;border-radius:50%;background:#FAEEDA;display:flex;align-items:center;justify-content:center;font-size:18px;border:2px solid #FAC775}
.h-greeting{font-size:12px;color:#854F0B}
.h-name{font-size:15px;font-weight:500;color:#3C2A10}
.h-right{display:flex;gap:12px;align-items:center}
.h-right i{font-size:21px;color:#854F0B}
.streak-bar{margin:0 18px 12px;background:#FAEEDA;border-radius:14px;padding:9px 13px;display:flex;align-items:center;justify-content:space-between;border:0.5px solid #FAC775}
.streak-left{display:flex;align-items:center;gap:8px}
.streak-icon{font-size:20px;color:#854F0B}
.streak-text{font-size:12px;color:#633806}
.streak-num{font-size:16px;font-weight:500;color:#3C2A10}
.streak-dots{display:flex;gap:4px}
.dot{width:22px;height:22px;border-radius:50%;background:#FAC775;display:flex;align-items:center;justify-content:center;font-size:11px;color:#633806;font-weight:500}
.dot.done{background:#639922;color:#fff}
.dot.today{background:#EF9F27;color:#fff}
.subject-row{padding:0 18px 12px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.subj-card{border-radius:16px;padding:13px 13px 11px;border:0.5px solid rgba(0,0,0,.06)}
.subj-icon-wrap{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.subj-icon-wrap i{font-size:19px}
.subj-name{font-size:13px;font-weight:500;margin-bottom:3px}
.subj-prog-bar{height:5px;border-radius:3px;margin-bottom:4px;overflow:hidden}
.subj-prog-fill{height:100%;border-radius:3px}
.subj-meta{font-size:11px}
.banner{margin:0 18px 12px;border-radius:18px;background:#5DCAA5;padding:14px 14px 12px;display:flex;align-items:center;gap:12px;border:0.5px solid #1D9E75}
.banner-text-wrap{flex:1;min-width:0}
.banner-eyebrow{font-size:11px;color:#E1F5EE;margin-bottom:3px}
.banner-title{font-size:14px;font-weight:500;color:#fff;line-height:1.35}
.banner-btn{background:#fff;border-radius:20px;padding:6px 14px;font-size:12px;font-weight:500;color:#0F6E56;white-space:nowrap;flex-shrink:0}
.banner-deco{font-size:36px;flex-shrink:0;color:rgba(255,255,255,.4);line-height:1}
.section-hd{display:flex;align-items:center;justify-content:space-between;padding:0 18px 8px}
.sec-title{font-size:14px;font-weight:500;color:#3C2A10}
.sec-more{font-size:12px;color:#854F0B}
.course-list{padding:0 18px 12px;display:flex;flex-direction:column;gap:8px}
.course-card{background:#fff;border-radius:16px;border:0.5px solid rgba(0,0,0,.07);padding:11px 13px;display:flex;align-items:center;gap:11px}
.course-thumb{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:22px}
.course-info{flex:1;min-width:0}
.course-name{font-size:13px;font-weight:500;color:#3C2A10;margin-bottom:2px}
.course-sub{font-size:11px;color:#854F0B}
.course-right{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.prog-pill{font-size:11px;padding:3px 8px;border-radius:20px;font-weight:500}
.play-btn{width:28px;height:28px;border-radius:50%;background:#EF9F27;display:flex;align-items:center;justify-content:center}
.play-btn i{font-size:14px;color:#fff}
.tools-grid{padding:0 18px 14px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.tool-item{display:flex;flex-direction:column;align-items:center;gap:5px}
.tool-icon{width:46px;height:46px;border-radius:14px;display:flex;align-items:center;justify-content:center}
.tool-icon i{font-size:20px}
.tool-lbl{font-size:11px;text-align:center;color:#633806;line-height:1.3}
.tabbar{display:flex;background:#fff;border-top:0.5px solid rgba(0,0,0,.08);padding:8px 0 10px}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab i{font-size:22px;color:#B4B2A9}
.tab.active i{color:#EF9F27}
.tab-lbl{font-size:10px;color:#B4B2A9}
.tab.active .tab-lbl{color:#EF9F27}
</style>
